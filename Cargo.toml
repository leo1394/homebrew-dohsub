[package]
name = "dohsub"
version = "0.1.1"
edition = "2021"
rust-version = "1.94"
description = "A small local subscription server with DNS-over-HTTPS address updates"
license = "MIT"
repository = "https://github.com/leo1394/homebrew-dohsub"

[dependencies]
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.5"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
url = "2.5"
hickory-proto = { version = "0.24", default-features = false }
tiny_http = "0.12"
semver = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
